<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipBox Floating Window</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; user-select: none; }
      body { display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ball { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #ffffff30; border-radius: 12px; background: #211332; color: #fff; cursor: grab; transition: background 140ms ease; }
      .ball.dragging { background: #302044; }
      .ball.error { color: #f87171; }
      .icon { width: 28px; height: 28px; pointer-events: none; }
      .progress { font-size: 13px; font-weight: 700; pointer-events: none; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="ball" class="ball" aria-label="ClipBox 快速上传" title="拖入文件上传，双击打开 ClipBox，右键隐藏">
      <img id="logo" class="icon" src="/favicon.svg" alt="ClipBox" draggable="false" />
      <svg id="upload" class="icon" hidden viewBox="0 0 24 24" fill="none" stroke="#ac7aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="上传"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4" /></svg>
      <span id="progress" class="progress" hidden></span>
      <svg id="complete" class="icon" hidden viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="上传完成"><path d="m5 12 4 4L19 6" /></svg>
      <svg id="error" class="icon" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-label="上传失败"><path d="m6 6 12 12M6 18 18 6" /></svg>
    </div>
    <script src="/floating.js"></script>
  </body>
</html>
