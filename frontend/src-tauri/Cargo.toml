[package]
name = "clipbox-desktop"
version = "0.1.0"
description = "ClipBox desktop client"
authors = ["MeTerminator"]
edition = "2021"

[[bin]]
name = "ClipBox"
path = "src/main.rs"

[lib]
name = "clipbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["sync"] }
arboard = "3.6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
open = "5"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.19"
core-foundation = "0.7"
foreign-types = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"
