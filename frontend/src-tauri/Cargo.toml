[package]
name = "clipbox-desktop"
version = "0.1.0"
description = "ClipBox desktop client"
authors = ["MeTerminator"]
edition = "2021"

[lib]
name = "clipbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
